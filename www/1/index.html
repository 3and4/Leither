        <h1>Leither</h1>
        <p>Leither是一个超轻量级去中心化的云操作系统，它以去中心化的方式肢解和重构传统的互联网业务，以在改变互联网日益中心化的趋势。</p>
        <p>用户可以构建或加入一个去中心化的网络，可以从网络中获取或发布应用服务和信息。整个网络中，信息（包括应用）的生成、存储、发布、展现、传播都是完全去中心化的。</p>
        <h2>功能体验</h2>
        <p>可以通过命令行，浏览器，api开发应用等多种方式体验功能。</p>
        <h2>网络</h2>
        <p>节点启动之后，通过引导节点进入网络。</p>
        <h2>弥媒</h2>
        <p>弥媒是一个信息容器，里面可以存放文件或数据库。</p>

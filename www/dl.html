<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leither - 下载</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-logo">
                <a href="index.html" class="logo-link">Leither</a>
            </div>
            <ul class="nav-menu">
                <li class="nav-item">
                    <a href="index.html" class="nav-link">首页</a>
                </li>
                <li class="nav-item">
                    <a href="#" class="nav-link">文档</a>
                </li>
                <li class="nav-item">
                    <a href="#" class="nav-link">示例</a>
                </li>
                <li class="nav-item">
                    <a href="install.html" class="nav-link">安装</a>
                </li>
            </ul>
        </div>
    </nav>

    <!-- 主要内容区域 -->
    <main class="main-content">
        <div class="hero-section">
            <div class="hero-container">
                
                <div class="install-content">
                    <section class="install-section">
                        <h2>版本：</h2>
                        
                        <table class="download-table">
                            <thead>
                                <tr>
                                    <th>文件名</th>
                                    <th>操作系统</th>
                                    <th>架构</th>
                                    <th>大小</th>
                                </tr>
                            </thead>
                            <tbody id="download-table">
                                <!-- 表格内容将由JS动态生成 -->
                            </tbody>
                        </table>
                        <script>
// 公共基础URL
const BASE_URL = window.location.origin == 'file://'? 'http://vzhan.cn' : window.location.origin;
//const BASE_URL = window.location.origin == 'file://'? 'http://127.0.0.1:4800' : window.location.origin;
//http://127.0.0.1:4800/entry?aid=x-zuVGwiGXZvq7q9FbojNldrjSD&mid=Fc1BRTFafOGzq5P8KmkVJqwS2v2&ver=last
const URL_ReqFilesInfo = `${BASE_URL}/entry?aid=x-zuVGwiGXZvq7q9FbojNldrjSD&mid=Fc1BRTFafOGzq5P8KmkVJqwS2v2&ver=last`;
console.log(URL_ReqFilesInfo);
// 替换硬编码的reqData为HTTP请求
async function fetchFilesInfo() {
    try {
        const response = await fetch(URL_ReqFilesInfo);
        if (!response.ok) {
            throw new Error(`HTTP error! status: ${response.status}`);
        }
        const data = await response.json();
        return data;
    } catch (error) {
        console.error('Error fetching files info:', error);
        return null;
    }
}

// 使用示例
fetchFilesInfo().then(data => {
    if (data) {
        // 处理获取到的数据
        console.log('Files info:', data);
        VERSION = data[0].Ver;
        downloadData = data[0].Files;
        renderDownloadTable(data);
    }
});

// const reqData =`[{"Ver":"V0.21.06","Files":[{"FileName":"Leither.darwin.amd64","Size":"22994960"},{"FileName":"Leither.darwin.arm64","Size":"70066514"},{"FileName":"Leither.linux.amd64","Size":"22068132"},{"FileName":"Leither.linux.arm64","Size":"19589836"},{"FileName":"Leither.linux.arm7","Size":"18865108"},{"FileName":"Leither.windows.amd64","Size":"23018496"}]}]`
//const data = JSON.parse(reqData);
//var VERSION = data[0].Ver;
//const files = data[0].Files;

const BASE_PATH = `${BASE_URL}/mm/Fc1BRTFafOGzq5P8KmkVJqwS2v2`;

// 版本号
var VERSION = "V0.21.06";
// 完整基础URL
const VERSION_URL = `${BASE_PATH}/${VERSION}`;
console.log(VERSION_URL);
/**
 * 架构映射表
 * 将文件名后缀映射为可读的架构名称
 */
const ARCH_MAP = {
  'amd64': 'x86-64',
  'arm64': 'ARM64',
  'arm7': 'ARMv7'
};

/**
 * 操作系统映射表
 * 将文件名中的系统标识映射为可读的系统名称
 */
const OS_MAP = {
  'darwin': 'macOS',
  'linux': 'Linux',
  'windows': 'Windows'
};

/**
 * 下载数据配置
 * 现在只需要文件名和文件大小
 */
// const downloadData = files
var downloadData = [
  {
    FileName: "Leither.darwin.amd64",
    Size: "21.9M"
  },
  {
    FileName: "Leither.darwin.arm64",
    Size: "61.9M"
  },
  {
    FileName: "Leither.linux.amd64",
    Size: "21M"
  },
  {
    FileName: "Leither.linux.arm64",
    Size: "18.7M"
  },
  {
    FileName: "Leither.linux.arm7",
    Size: "18M"
  },
  {
    FileName: "Leither.windows.amd64",
    Size: "22M"
  }
];

/**
 * 从文件名解析操作系统信息
 * @param {string} fileName - 完整文件名
 * @returns {string} 操作系统名称
 */
function parseOS(fileName) {
  const parts = fileName.split('.');
  const osKey = parts[parts.length - 2]; // 获取倒数第二部分作为系统key
  return OS_MAP[osKey] || osKey; // 返回映射值或原值
}

/**
 * 从文件名解析架构信息
 * @param {string} fileName - 完整文件名
 * @returns {string} 架构名称
 */
function parseArch(fileName) {
  const parts = fileName.split('.');
  const archKey = parts[parts.length - 1]; // 获取最后部分作为架构key
  return ARCH_MAP[archKey] || archKey; // 返回映射值或原值
}

/**
 * 渲染下载表格
 * 根据downloadData动态生成表格行
 * 同时更新页面上的版本号显示
 */
function renderDownloadTable() {
  const tbody = document.getElementById('download-table');
  
  // 更新页面上的版本号显示
  const versionElement = document.querySelector('.install-section h2');
  if (versionElement) {
    versionElement.textContent = `版本：${VERSION}`;
  }
  
  // 生成表格行HTML，动态解析操作系统和架构
  const rows = downloadData.map(item => 
    `<tr>
      <td><a href="${VERSION_URL}/${item.FileName}">${item.FileName}</a></td>
      <td>${parseOS(item.FileName)}</td>
      <td>${parseArch(item.FileName)}</td>
      <td>${item.Size}</td>
    </tr>`
  ).join('');
  
  tbody.innerHTML = rows;
}

// 页面加载完成后初始化表格
window.addEventListener('DOMContentLoaded', renderDownloadTable);
                        </script>
                    </section>
                </div>
            </div>
        </div>
    </main>

    <!-- 页脚 -->
    <footer class="footer">
        <div class="footer-container">
            <p>&copy; 2025 Leither. 构建属于我们的去中心化生态。</p>
        </div>
    </footer>
</body>
</html>
